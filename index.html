<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7ec850">
<title>cyber-probe · 探针鸡</title>
<!-- 站点图标：页签用 favicon.svg，iOS「加到主屏幕」用 180×180、不透明（RGB，无 alpha）的 apple-touch-icon.png
     —— hub 1.4.0 起第三方前端要自带这张图，否则 iOS 书签只会拿页面截图当图标。
     两个引用都由 tools/cachebust.py 打 ?v=<部署时间戳>：它们是不带内容哈希的稳定文件名，
     CF 橙云会把 no-cache 改写成 4 小时浏览器缓存，不打版本号就最久 4 小时看不到更新。 -->
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="hud">
  <div id="topbar">
    <div class="stat" title="monitor 探针在线节点数">🐔 探针鸡 在线 <b id="online">–</b><i> / <span id="online-total">–</span></i> 鸡</div>
    <div class="stat" title="ping 探测任务数：每个探测任务对应一只网站鸡">🌐 网站鸡 在线 <b id="web-online">–</b><i> / <span id="web-total">–</span></i> 鸡</div>
    <div class="stat" title="CPU/内存超阈值、或者网络最差的探针鸡：都会主动攻击你，而且打它也不会跑（永远回击）">🔥 暴躁鸡 <b id="hot">–</b> 只</div>
    <div class="stat dim" id="visitors" title="场上玩家">👤 访客 <b>1</b> 鸡</div>
  </div>

  <div id="feed"></div>
  <div id="banner"></div>

  <!-- 右上啄倒榜：默认收起，点标题展开/收起。行 = 场上每只鸡的啄倒数（服务端裁定） -->
  <div id="board" class="collapsed" title="点击展开 / 收起">
    <h3 id="board-title">🐔 啄倒榜</h3>
    <div id="board-rows"></div>
  </div>

  <!-- 左下自身卡片：名字 / 血量 / 啄倒数 -->
  <div id="me">
    <div id="me-name">–</div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="score"></div>
  </div>

  <!-- 操作说明：底部中置一条（桌面/手机文案不同，由 JS 切换） -->
  <div id="hint"></div>

  <!-- 移动端控件 -->
  <div id="touch" class="hidden">
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="tbtns">
      <button id="t-peck">啄</button>
      <button id="t-jump">跳</button>
      <button id="t-run">跑</button>
    </div>
  </div>
</div>

<!-- 详情抽屉 -->
<aside id="detail" class="hidden">
  <header>
    <div id="d-title">–</div>
    <button id="d-close" title="关闭">✕</button>
  </header>
  <div id="d-body"></div>
</aside>

<div id="errbar" class="hidden"></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
