<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7ec850">
<title>cyber-probe · 探针鸡</title>
<!-- 站点图标：就只有一只 🐔，没有底色（favicon.svg 用各平台 emoji 字体画，另配 32×32 的 PNG 兜底；
     iOS「加到主屏幕」用 180×180 的 apple-touch-icon.png —— 透明底，iOS 会自己垫黑
     —— hub 1.4.0 起第三方前端要自带这张图，否则 iOS 书签只会拿页面截图当图标。
     两个引用都由 tools/cachebust.py 打 ?v=<部署时间戳>：它们是不带内容哈希的稳定文件名，
     CF 橙云会把 no-cache 改写成 4 小时浏览器缓存，不打版本号就最久 4 小时看不到更新。 -->
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./style.css">
<!-- three/addons/ 是给 精细模型用的（它们 import 'three/addons/...' 的两个工具类），
     只多两份 r169 的 examples/jsm 文件，不走 CDN。 -->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
<!-- ⚡ 预热 精细模型（不 import three，所以能在 three.js 还在下载时就把模型拉下来）：
     不这么做的话，进页面会先看到一批自建道具、过一两秒才被精细模型替换掉。
     必须在 importmap 之后（模型模块内部 import 'three' 要靠它解析）。 -->
<script src="./js/site-options.js"></script>
<script type="module" src="./js/prewarm.js"></script>
</head>
<body>
<div id="app"></div>

<!-- 首屏：精细模型到位前先不显示 3D 画布（切换逻辑在主模块的 reveal） -->
<div id="boot"><span>🐔 正在布置农场…</span></div>

<!-- HUD -->
<div id="hud">
  <div id="topbar">
    <div class="stat" title="monitor 探针在线节点数">🐔 探针鸡 在线 <b id="online">–</b><i> / <span id="online-total">–</span></i> 鸡</div>
    <div class="stat" title="ping 探测任务数：每个探测任务对应一只网站鸡">🌐 网站鸡 在线 <b id="web-online">–</b><i> / <span id="web-total">–</span></i> 鸡</div>
    <div class="stat" title="CPU/内存超阈值、或者网络最差的探针鸡：都会主动攻击你，而且打它也不会跑（永远回击）">🔥 暴躁鸡 <b id="hot">–</b> 只</div>
    <div class="stat dim" id="visitors" title="场上玩家">👤 访客 <b>1</b> 鸡</div>

    <!-- 前台工具：和 monitor 探针主题一样，公开首页就是站点的门面 ——
         🖥 打开「探针列表」悬浮层（列出加进监控的所有服务器）；⚙ 进 hub 的管理后台。
         后台入口走同域 /admin（nginx 反代到 hub，带来源白名单），所以这里用相对路径。 -->
    <div id="tools">
      <button id="btn-probes" type="button" title="探针列表：这台站监控的所有服务器" aria-label="探针列表">🖥</button>
      <a id="btn-admin" href="/admin/" title="管理后台（仅授权网络可访问）" aria-label="管理后台">⚙</a>
    </div>
  </div>

  <div id="feed"></div>
  <div id="banner"></div>

  <!-- 右上啄倒榜：默认收起，点标题展开/收起。行 = 场上每只鸡的啄倒数（服务端裁定） -->
  <div id="board" class="collapsed" title="点击展开 / 收起">
    <h3 id="board-title">🐔 啄倒榜</h3>
    <div id="board-rows"></div>
  </div>

  <!-- 左下自身卡片：名字 / 血量 / 啄倒数 -->
  <div id="me">
    <div id="me-name">–</div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="score"></div>
  </div>

  <!-- 操作说明：底部中置一条（桌面/手机文案不同，由 JS 切换） -->
  <div id="hint"></div>

  <!-- 移动端控件 -->
  <div id="touch" class="hidden">
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="tbtns">
      <button id="t-peck">啄</button>
      <button id="t-jump">跳</button>
      <button id="t-run">跑</button>
    </div>
  </div>
</div>

<!-- 详情抽屉 -->
<aside id="detail" class="hidden">
  <header>
    <div id="d-title">–</div>
    <button id="d-close" title="关闭">✕</button>
  </header>
  <div id="d-body"></div>
</aside>

<div id="errbar" class="hidden"></div>

<!-- 探针列表悬浮层：网页正中弹出，列出加进监控的所有服务器（数据来自 /api/nodes，6 秒一轮）。
     点卡片 → 关掉悬浮层并打开该节点的详情抽屉（和在场地上点探针鸡是同一张卡）。 -->
<div id="plist" class="hidden" role="dialog" aria-modal="true" aria-labelledby="plist-title">
  <div class="sheet">
    <header>
      <h3 id="plist-title">🖥 探针列表</h3>
      <span id="plist-sum"></span>
      <button id="plist-close" type="button" title="关闭（Esc）" aria-label="关闭">✕</button>
    </header>
    <div id="plist-body"></div>
    <p class="note">点任意一张卡片看这台机器的详情 · 数据每 6 秒刷新</p>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
